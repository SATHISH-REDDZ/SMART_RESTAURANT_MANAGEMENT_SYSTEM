{% extends "base.html" %}
{% block title %}Contact Support - Smart Restaurant{% endblock %}
{% block content %}

<div class="auth-wrapper" style="min-height: auto; padding: 2rem 0;">
    <div class="auth-card" style="max-width: 600px;">
        <h2 class="auth-title"><i class="fa-solid fa-headset text-primary"></i> Contact & Support</h2>
        <p class="auth-subtitle">Have questions or feedback? Send us a message below.</p>

        <form action="{{ url_for('customer.contact') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Your Name</label>
                <input type="text" name="name" class="form-input" placeholder="e.g. Sathish" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="sathish@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Subject</label>
                <input type="text" name="subject" class="form-input" placeholder="Order inquiry or feedback" required>
            </div>

            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea name="message" class="form-input" rows="4" placeholder="Write your query here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; justify-content: center;">
                <i class="fa-solid fa-paper-plane"></i> Send Message
            </button>
        </form>
    </div>
</div>

{% endblock %}
