{% extends "base.html" %}
{% block title %}Register Account - Smart Restaurant{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Register to enjoy seamless online food ordering & recommendations</p>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-input" placeholder="e.g. Sathish Kumar" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-input" placeholder="sathish@example.com" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-input" placeholder="Min 6 chars" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="Repeat password" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-input" placeholder="9876543210">
            </div>

            <div class="form-group">
                <label class="form-label">Delivery Address</label>
                <textarea name="address" class="form-input" rows="2" placeholder="Street, Flat No, City, Pincode"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <i class="fa-solid fa-user-plus"></i> Complete Registration
            </button>
        </form>

        <div class="auth-footer-text">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log In here</a>
        </div>
    </div>
</div>
{% endblock %}
